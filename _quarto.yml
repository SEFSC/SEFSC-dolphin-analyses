project: 
  type: book

book: 
  page-navigation: true
  title: "Analyses to support the Dolphinfish Management Strategy Evaluation in the U.S. Atlantic" 
  site-url: "https://www.fisheries.noaa.gov/southeast/science-data/dolphinfish-management-strategy-evaluation-us-atlantic" 
  repo-url: "https://github.com/SEFSC/SEFSC-dolphin-analyses/tree/main"
  repo-actions: [edit, source, issue]
  favicon: assets/favicon.ico
  downloads: [pdf, docx]
  search: true
  author:
    - name: Mandy Karnauskas  
      affiliations:
        - name: NOAA Fisheres
          department: Southeast Fisheries Science Center
          
  chapters:
    - index.qmd
    - makeEEZ.qmd
    - MRIP.qmd
    - commercial.qmd
    - SAU_highseas.qmd
    - SAU_EEZs.qmd
    - compile_all_data.qmd
    
  page-footer:
    right: "This page is built with [Quarto](https://quarto.org/)."
    left: "&copy; CC-1.0"
  
  sidebar:
    background: "#D9E3E4"
    logo: "https://raw.githubusercontent.com/nmfs-opensci/assets/main/logo/nmfs-opensci-logo3.png"
    favicon: images/favicon.ico
    pinned: true
    align: center
    tools: 
      - icon: globe
        href: https://www.fisheries.noaa.gov/southeast/science-data/dolphinfish-management-strategy-evaluation-us-atlantic
        text: "dolphinfish management strategy evaluation"
    style: "docked"
    search: true
    collapse-level: 1

bibliography: [content/references.bib]

execute:
  echo: false
  code-overflow: wrap

format:
  titlepage-pdf:
    documentclass: scrbook
    classoption: ["oneside", "open=any"]
    titlepage: "plain"
    keep-tex: true
  docx:
    toc: true
    toc-depth: 2
    reference-doc: template.docx
    always_allow_html: true
  html:
    theme: [cosmo, assets/theme.scss] 
    toc: true
    toc-depth: 3

filters:
  - assets/include-files.lua
  - quarto

# Comment next 2 lines if the PDF is having trouble
metadata-files:
  - _frontmatter.yml
 
